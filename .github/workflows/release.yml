name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "refs/heads/main" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi

          go build -ldflags="-s -w -X main.Version=${VERSION}" \
            -o idc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/idc/

      - name: Compress with UPX (Linux only)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          upx --best --lzma idc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: idc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: idc-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find ./artifacts -type f -name 'idc-*' -exec mv {} release/ \;
          cd release
          for f in idc-*; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Get version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "refs/heads/main" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Identity Chain ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: release/*
          body: |
            ## Identity Chain ${{ steps.version.outputs.version }}

            Kubernetes Identity & Blast Radius Analyzer

            ### Installation

            ```bash
            # macOS (Apple Silicon)
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/idc-darwin-arm64 -o idc
            chmod +x idc && sudo mv idc /usr/local/bin/

            # macOS (Intel)
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/idc-darwin-amd64 -o idc
            chmod +x idc && sudo mv idc /usr/local/bin/

            # Linux (amd64)
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/idc-linux-amd64 -o idc
            chmod +x idc && sudo mv idc /usr/local/bin/

            # Linux (arm64)
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/idc-linux-arm64 -o idc
            chmod +x idc && sudo mv idc /usr/local/bin/
            ```

            ### Quick Start

            ```bash
            # Generate interactive security dashboard
            idc dashboard -A -f dashboard.html
            open dashboard.html

            # Analyze blast radius for all workloads
            idc blast --all -A

            # Include cloud IAM analysis
            idc blast --all -A --include-cloud --aws-region us-west-2
            ```

            See [README](https://github.com/${{ github.repository }}#readme) for full documentation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
